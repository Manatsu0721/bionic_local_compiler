name: Build Android Clang (cross)

on:
  workflow_dispatch:  # 手动触发，您也可以添加 push 等

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出版本库（用于存放源码和后续打包）
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装系统依赖（包括 libmpc-dev 等），使用旧版本cmake
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison texinfo gawk cmake ninja-build clang  
          # ↑ 日后如果action系统版本更新，请设法降级cmake。
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5

      # 3. 下载 Android NDK r27d
      - name: Download NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip -d $HOME/
          echo "NDK=$HOME/android-ndk-r27d" >> $GITHUB_ENV


      # 4. 克隆仓库，准备源码
      - name: Clone files - Prepare Clang source
        run: |
          mkdir -p $HOME/project
          mkdir -p $HOME/project/llvm-build
          # Download Source
          cd $HOME/project
          git clone https://android.googlesource.com/toolchain/clang
          cd clang 
          git checkout 745b335211bb9eadfa6aa6301f84715cee4b37c5
          cd ..
          git clone https://android.googlesource.com/toolchain/llvm
          cd llvm
          git checkout 60cf23e54e46c807513f7a36d0a7b777920b5881
          cd ..
          git clone https://android.googlesource.com/toolchain/lld
          cd lld
          git checkout 35c021c49f44cd4e06875c4b1398a2b3464132bb
          cd ..
          git clone --depth=1 https://github.com/Manatsu0721/bionic_local_compiler.git
          chmod +x $HOME/project/bionic_local_compiler/build-clang.sh
          chmod +x $HOME/project/bionic_local_compiler/ld-wrap.sh

      # 5. 设置其他环境变量
      - name: Set env vars
        run: |
          # 注：$NDK移到前面步骤，否则在这里展开不了。
          echo "SYSROOT=$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> $GITHUB_ENV
          echo "PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH" >> $GITHUB_ENV
          echo "TARGET=aarch64-linux-android" >> $GITHUB_ENV
          echo "CC=aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "CXX=aarch64-linux-android24-clang++" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=llvm-ranlib" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "LD=$HOME/project/bionic_local_compiler/ld-wrap.sh" >> $GITHUB_ENV



      - name: Build Clang
        run: $HOME/project/bionic_local_compiler/build-clang.sh


      # 9. 打包构建目录
      - name: Package
        if: success()
        run: |
          cd $HOME/project/llvm-build
          tar -czf ../build-install.tar.gz install

      # 10. 上传到 Release
      - name: Upload to Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: $HOME/project/build-install.tar.gz
          tag_name: build-${{ github.run_number }}
          name: "Clang 9.0.3 for Android (Build ${{ github.run_number }})"
          body: "Cross-built Clang 9.0.3 targeting aarch64-linux-android, using NDK r27d."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show config.log on failure
        if: failure()
        run: |
          # 暂时没想到能写什么。
          sleep 0.1